Resources:
  MyWebsite:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: FALSE
        BlockPublicPolicy: FALSE
        IgnorePublicAcls: FALSE
        RestrictPublicBuckets: FALSE
      WebsiteConfiguration:
        IndexDocument: index.html
      BucketName: cloud-resume-website-16ed7180
  
  MyRoute53Record:
    Type: "AWS::Route53::RecordSetGroup"
    Properties:
      HostedZoneId: Z00162993DNXR218MVQ3Q
      RecordSets:
        - Name: dev-dan-resume.com
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt ResumeDistribution.DomainName
  
  ResumeCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: dev-dan-resume.com
      ValidationMethod: DNS

  ResumeDistribution:
    Type: "AWS::CloudFront::Distribution"
    Properties:
      DistributionConfig:
        ViewerCertificate:
          AcmCertificateArn: !Ref ResumeCertificate
          SslSupportMethod: sni-only
        Aliases:
          - dev-dan-resume.com
        DefaultCacheBehavior:
          ViewerProtocolPolicy: allow-all
          TargetOriginId: cloud-resume-website-16ed7180.s3.us-east-1.amazonaws.com
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 0
          ForwardedValues:
            QueryString: false
        Origins:
          - DomainName: cloud-resume-website-16ed7180.s3.us-east-1.amazonaws.com
            Id: cloud-resume-website-16ed7180.s3.us-east-1.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: match-viewer
        Enabled: "true"
        DefaultRootObject: index.html
    
  ResumeDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: resume-visits-counter
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "ID"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "ID"
          KeyType: "HASH"
